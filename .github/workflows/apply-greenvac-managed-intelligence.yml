name: Apply GreenVac managed intelligence patch
on:
  push:
    branches:
      - codex/greenvac-managed-intelligence-20260911
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply supplied patch if present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .greenvac-managed-intelligence.patch ]; then
            echo "Patch not present yet; nothing to apply."
            exit 0
          fi
          git apply --check .greenvac-managed-intelligence.patch
          git apply .greenvac-managed-intelligence.patch
          rm .greenvac-managed-intelligence.patch
          rm .github/workflows/apply-greenvac-managed-intelligence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add GreenVac managed trade intelligence harness"
          git push origin HEAD:codex/greenvac-managed-intelligence-20260911
