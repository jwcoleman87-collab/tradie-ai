name: Apply miniflare audit fix
on:
  push:
    branches:
      - codex/audit-sharp-miniflare-20260911
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Update miniflare and lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev miniflare@5.20260910.0-alpha
          npm audit --audit-level=high
          rm .github/workflows/apply-miniflare-audit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/apply-miniflare-audit-fix.yml
          git commit -m "Update miniflare to clear sharp audit"
          git push origin HEAD:codex/audit-sharp-miniflare-20260911
